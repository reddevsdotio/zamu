# Self-hosting: Postgres 18, a one-shot migration, the web app and the worker, all from one image.
#
#   cp .env.example .env   # then set BETTER_AUTH_SECRET, BETTER_AUTH_URL and PUBLIC_URL
#   docker compose up -d --build
#   curl http://localhost:3000/api/healthz
#
# Variables come from .env (or the shell). DATABASE_URL in .env is for local development and is not used here:
# the containers reach Postgres as "db" on the internal network. Postgres is not published on the host, so this
# stack runs next to the development database from docker-compose.dev.yml.
name: zamu

# web and worker run the image that the migrate service builds (building it once instead of three times).
x-app: &app
  image: ${ZAMU_IMAGE:-zamu:local}
  pull_policy: never
  init: true
  restart: unless-stopped
  environment: &app-env
    DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-zamu}
    BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env (openssl rand -base64 32)}
    BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    # Single sign-on (OIDC); empty values mean unset. See docs/self-hosting.md.
    OIDC_ISSUER: ${OIDC_ISSUER:-}
    OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
    OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
    OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-}
    OIDC_SCOPES: ${OIDC_SCOPES:-}
    OIDC_SIGNUP: ${OIDC_SIGNUP:-}
    OIDC_ADMIN_GROUPS: ${OIDC_ADMIN_GROUPS:-}
    OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-}
    OIDC_TRUST_EMAIL: ${OIDC_TRUST_EMAIL:-}
    OIDC_WORKSPACE: ${OIDC_WORKSPACE:-}
    PASSWORD_LOGIN: ${PASSWORD_LOGIN:-}
    # Who may create a workspace: everyone (the default) or owners. See docs/self-hosting.md.
    WORKSPACE_CREATION: ${WORKSPACE_CREATION:-}
    # Client IP headers set by your reverse proxy, in order. See docs/self-hosting.md.
    TRUSTED_IP_HEADERS: ${TRUSTED_IP_HEADERS:-}
    # IANA time zone that decides when cycles end (midnight on their end date). Empty means UTC.
    APP_TIME_ZONE: ${APP_TIME_ZONE:-}
    # Encrypts git connection tokens and webhook secrets (openssl rand -base64 32). Empty: git connections
    # and Backlog.md mirrors are disabled. Back it up with the database. See docs/self-hosting.md.
    APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
    # Git connections to private-network hosts (self-hosted GitLab or Forgejo next to the app), and hosts
    # reached over plain HTTP (test containers only). See docs/self-hosting.md.
    GIT_ALLOW_PRIVATE_HOSTS: ${GIT_ALLOW_PRIVATE_HOSTS:-}
    GIT_HTTP_HOSTS: ${GIT_HTTP_HOSTS:-}

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-zamu}
    volumes:
      # postgres:18 keeps its data under /var/lib/postgresql/18/docker, so mount the parent directory.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *app
    build:
      context: .
    command: ["migrate"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    command: ["web"]
    environment:
      <<: *app-env
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ["worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
