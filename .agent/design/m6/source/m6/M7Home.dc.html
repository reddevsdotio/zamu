<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Home with merged and check-again groups</title>
<script src="../support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="stylesheet" href="../r2/margin.css" />
<link rel="stylesheet" href="../r2/screens.css" />
<link rel="stylesheet" href="./m6.css" />
<link rel="stylesheet" href="./m7.css" />
<script src="../r2/data.js"></script>
<style>
body{margin:0}
.home .list{flex:1;min-height:0;overflow:hidden}
.home .row .why{width:230px;text-align:right;overflow:hidden;text-overflow:ellipsis}
.home .row .pill{height:19px}
.home .grp .muted{font-weight:400;font-size:var(--fs-sm)}
</style>
</helmet>
<div class="{{ rootClass }}" data-screen-label="Home, M7">
<dc-import name="Side" home="{{ true }}" theme="{{ theme }}" hint-size="236px,900px"></dc-import>
<main class="main">
<header class="vh">
<div class="crumb"><span class="crumb-proj">Home</span></div>
<div class="tabs"><sc-for list="{{ tabs }}" as="tb" hint-placeholder-count="3"><span class="{{ tb.cls }}">{{ tb.n }}<sc-if value="{{ tb.hasC }}" hint-placeholder-val="{{ false }}"><span class="nav-count">{{ tb.c }}</span></sc-if></span></sc-for></div>
<span class="spacer"></span>
<span class="search"><span class="ico ico-search"></span><span class="nav-l search-l">Search</span><span class="nav-l kbd">/</span></span>
<span class="btn primary">New task<span class="kbd">C</span></span>
</header>
<div class="home">
<div class="home-hd"><span class="home-t">{{ greet }}</span><span class="home-sub">{{ sub }}</span></div>
<div class="list">
<sc-for list="{{ groups }}" as="g" hint-placeholder-count="4">
<div class="grp"><span class="tri down"></span><span>{{ g.name }}</span><span class="col-count">{{ g.count }}</span><span class="muted">{{ g.hint }}</span></div>
<sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="2">
<div class="{{ r.cls }}">
<sc-if value="{{ r.ph }}" hint-placeholder-val="{{ false }}"><span class="pri h"></span></sc-if>
<sc-if value="{{ r.priBlank }}" hint-placeholder-val="{{ true }}"><span class="pri blank"></span></sc-if>
<span class="proj"><span class="{{ r.tile }}">{{ r.tileI }}</span>{{ r.projName }}</span>
<span class="key">{{ r.key }}</span>
<span class="{{ r.stCls }}"></span>
<span class="row-t">{{ r.title }}</span>
<span class="row-r">
<sc-for list="{{ r.pills }}" as="p" hint-placeholder-count="1"><span class="{{ p.cls }}">{{ p.t }}</span></sc-for>
<sc-if value="{{ r.hasChk }}" hint-placeholder-val="{{ false }}"><span class="chk ready"><span class="ico-wait"></span>{{ r.chkTxt }}</span></sc-if>
<sc-if value="{{ r.showDue }}" hint-placeholder-val="{{ false }}"><span class="{{ r.dueCls }}">{{ r.dueTxt }}</span></sc-if>
<span class="why">{{ r.why }}</span>
<span class="{{ r.avCls }}">{{ r.avI }}</span>
</span>
</div>
</sc-for>
</sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{
  "theme": { "editor": "enum", "options": ["light", "dark"], "default": "light" },
  "state": { "editor": "enum", "options": ["mine", "everyone"], "default": "mine" }
}'>
class Component extends DCLogic {
  componentDidMount() {
    if (!window.PM) { const i = setInterval(() => { if (window.PM) { clearInterval(i); this.forceUpdate(); } }, 30); }
  }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const s = this.props.state ?? 'mine';
    const PJ = { PAY: ['tile c6', 'P', 'Payments'], HBR: ['tile c1', 'H', 'Harbor'], ATL: ['tile c3', 'A', 'Atlas'] };
    const AV = { ana: ['av av-ana', 'AR'], tf: ['av av-tf', 'TF'], cd: ['av agent av-cd', 'cd'], rb: ['av agent av-rb', 'rb'] };
    const R = (pj, key, st, title, w, why, o) => { o = o || {}; return { cls: 'row' + (o.sel ? ' sel' : ''), ph: !!o.h, priBlank: !o.h, tile: PJ[pj][0], tileI: PJ[pj][1], projName: PJ[pj][2], key, stCls: 'st ' + st, title,
      pills: o.pills || [], hasChk: !!o.chk, chkTxt: o.chk || '', showDue: !!o.due, dueCls: o.due ? 'due ' + o.due[0] : 'due', dueTxt: o.due ? o.due[1] : '', why, avCls: AV[w][0], avI: AV[w][1] }; };
    const pill = (t, c) => ({ t, cls: 'pill' + (c ? ' ' + c : '') });
    const review = [R('PAY', 'PAY-142', 'rev', 'Retry failed payouts with exponential backoff', 'cd', '#482 open · 1 criterion open', { h: true, pills: [pill('4 of 6 criteria')] }),
      R('HBR', 'HBR-164.3', 'rev', 'Savings goals: weekly top-up rule', 'cd', 'in review for 2 days')];
    const merged = [R('PAY', 'PAY-150', 'done', 'Payout report export', 'cd', '#479 merged yesterday by Tomás', { sel: true, pills: [pill('Merged with 2 open criteria', 'acc')] })];
    const merged2 = merged.concat([R('ATL', 'ATL-31', 'done', 'Rate-limit the public search endpoint', 'rb', '!88 merged 3 days ago by Ana', { pills: [pill('Merged with 1 open criterion', 'acc')] })]);
    const check = [R('PAY', 'PAY-131', 'todo', 'Rotate the bank API certificate', 'ana', 'The bank issues the new certificate on Dec 1', { chk: 'Check again: today' }),
      R('HBR', 'HBR-88', 'todo', 'Re-test push delivery on the new Android beta', 'ana', 'Beta 3 was due on Nov 28', { chk: 'Check again: 3 days ago' })];
    const blocked = [R('PAY', 'PAY-158', 'prog', 'Payout fee shows twice on the monthly statement', 'ana', 'waits on PAY-120', { h: true, pills: [pill('Blocked', 'warn')] })];
    const overdue = [R('HBR', 'HBR-71', 'prog', 'Inbox sorting shows untranslated labels in every locale', 'cd', 'for Ana', { due: ['over', '3 days overdue'] })];
    const assigned = [R('PAY', 'PAY-146', 'prog', 'Alert on-call after the 8th attempt', 'cd', 'for Ana'), R('PAY', 'PAY-151', 'todo', 'Show payout fees on the merchant statement', 'ana', ''), R('HBR', 'HBR-90', 'todo', 'Offline cache: browse every tab without a connection', 'ana', '')];
    const week = [R('PAY', 'PAY-142', 'rev', 'Retry failed payouts with exponential backoff', 'cd', 'for Ana', { due: ['soon', 'Friday'] }), R('ATL', 'ATL-40', 'prog', 'Move search indexing to the worker', 'tf', '', { due: ['', 'Sunday'] })];
    const G = (name, rows, hint) => ({ name, count: String(rows.length), hint: hint || '', rows });
    const mine = [G('Needs review', review), G('Merged with open criteria', merged, 'Done through a merge. Check the criteria, waive them or reopen the task.'), G('Check again', check, 'The day you set has come.'), G('Blocked', blocked), G('Overdue', overdue), G('Assigned', assigned)];
    const everyone = [G('Needs review', review.concat([R('ATL', 'ATL-38', 'rev', 'Search results page: empty and error states', 'rb', 'for Tomás')])), G('Merged with open criteria', merged2, 'Done through a merge, with criteria still open.'), G('Blocked', blocked), G('Overdue', overdue), G('Due this week', week)];
    const isMine = s === 'mine';
    return { rootClass: 'app ' + theme, theme,
      tabs: [{ n: 'Mine', cls: 'tab' + (isMine ? ' on' : ''), hasC: true, c: '7' }, { n: 'Everyone', cls: 'tab' + (isMine ? '' : ' on'), hasC: false, c: '' }, { n: 'Agents', cls: 'tab', hasC: false, c: '' }],
      greet: isMine ? 'Good morning, Ana' : 'Everyone', sub: isMine ? '7 things wait on you' : 'Northwind Labs, 6 projects',
      groups: isMine ? mine : everyone };
  }
}
</script>
</body>
</html>
